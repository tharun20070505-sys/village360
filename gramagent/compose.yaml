services:
  api:
    build:
      context: ..
      dockerfile: gramagent/api/Dockerfile
    env_file: .env
    ports: ["127.0.0.1:8000:8000"]
    volumes: ["gramagent-data:/app/.gramagent"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
  worker:
    build:
      context: ..
      dockerfile: gramagent/api/Dockerfile
    env_file: .env
    command: ["python", "-m", "gramagent.worker"]
    volumes: ["gramagent-data:/app/.gramagent"]
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
volumes:
  gramagent-data:
