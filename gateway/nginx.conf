# Production Reverse Proxy & API Gateway Configuration
# Features: Load Balancing, Rate Limiting, Caching, Circuit Breaking Fallbacks, Gzip Compression

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # Performance optimizations
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        text/xml
        application/xml
        application/xml+rss
        image/svg+xml;

    # Rate Limiting Zones
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/m;

    # Proxy Cache Zone (for static and discovery responses)
    proxy_cache_path /tmp/nginx_cache levels=1:2 keys_zone=cache_zone:10m max_size=100m inactive=60m use_temp_path=off;

    # Upstream Backend Cluster with Load Balancing (Round-Robin / Least Connections)
    upstream backend_cluster {
        least_conn; # Route to backend with fewest active connections
        server backend:5001 max_fails=3 fail_timeout=10s;
        server backend_replica:5001 backup;
        keepalive 32; # Connection pooling
    }

    server {
        listen 80;
        server_name localhost;

        # Security Headers
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header X-Gateway "Village360-API-Gateway" always;

        # API Gateway & Reverse Proxy
        location /api/ {
            limit_req zone=api_limit burst=20 nodelay;

            proxy_pass http://backend_cluster;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Timeouts & Circuit Breaking
            proxy_connect_timeout 5s;
            proxy_send_timeout 15s;
            proxy_read_timeout 15s;
            proxy_next_upstream error timeout http_502 http_503 http_504;

            # Buffer settings
            proxy_buffers 8 16k;
            proxy_buffer_size 16k;
        }

        # Auth Rate Limiting
        location /api/auth/login {
            limit_req zone=auth_limit burst=5 nodelay;

            proxy_pass http://backend_cluster;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Cacheable Discovery Endpoints
        location /api/discovery {
            proxy_cache cache_zone;
            proxy_cache_valid 200 60s;
            proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
            add_header X-Cache-Status $upstream_cache_status;

            proxy_pass http://backend_cluster;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
        }

        # Gateway Health Probe
        location /gateway-health {
            access_log off;
            return 200 '{"status":"ok","gateway":"active","upstream":"backend_cluster"}\n';
            add_header Content-Type application/json;
        }

        # Frontend Static Files
        location / {
            root /usr/share/nginx/html;
            try_files $uri $uri/ /index.html;
            expires 1d;
            add_header Cache-Control "public, no-transform";
        }
    }
}
