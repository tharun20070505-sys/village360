services:
  gateway:
    image: nginx:alpine
    container_name: village360-gateway
    ports:
      - "80:80"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - backend_replica
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: village360-backend-1
    environment:
      - PORT=5001
      - NODE_ENV=production
      - MONGODB_URI=${MONGODB_URI}
      - SESSION_SECRET=${SESSION_SECRET}
      - ADMIN_EMAIL=${ADMIN_EMAIL}
      - TRUST_PROXY_HOPS=1
    restart: unless-stopped

  backend_replica:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: village360-backend-2
    environment:
      - PORT=5001
      - NODE_ENV=production
      - MONGODB_URI=${MONGODB_URI}
      - SESSION_SECRET=${SESSION_SECRET}
      - ADMIN_EMAIL=${ADMIN_EMAIL}
      - TRUST_PROXY_HOPS=1
    restart: unless-stopped
